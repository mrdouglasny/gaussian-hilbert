name = "gaussian-hilbert"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["GaussianHilbert"]

[leanOptions]
autoImplicit = false

[[require]]
name = "GaussianField"
git = "https://github.com/mrdouglasny/gaussian-field.git"
rev = "main"

[[require]]
name = "MarkovSemigroups"
git = "https://github.com/mrdouglasny/markov-semigroups.git"
rev = "main"

[[require]]
name = "mathlib"
scope = "leanprover-community"
version = "git#v4.29.0"

[[lean_lib]]
name = "GaussianHilbert"
