status:
  scope: >
    A Lean/Mathlib library for finite-dimensional Gaussian Hilbert space theory
    over the standard product Gaussian gamma_n on R^n, following Janson's
    "Gaussian Hilbert Spaces". Core pieces: (1) multivariate (probabilist's)
    Hermite polynomials and their L^2(gamma_n) orthogonality and density;
    (2) the Wiener chaos decomposition into orthogonal closed L^2 submodules;
    (3) the Ornstein-Uhlenbeck generator L = Delta - x.grad, its Hermite
    eigenfunction theorem, and the spectral OU semigroup acting by e^{-kt} on the
    k-th chaos; (4) the Bonami-Beckner-Nelson hypercontractive bound on each chaos
    and Janson Theorem 5.10 polynomial-chaos concentration; (5) an L^2 polynomial
    density theorem for sub-Gaussian measures on Fin n -> R. Infinite-dimensional
    Malliavin calculus is deliberately out of scope.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []                       # zero LOCAL axioms (BBN placeholder discharged 2026-05-15)
  # Inherited (transitive, from markov-semigroups) on the concentration results:
  #   gross_lsi_implies_hypercontractive, and 3 GaussianFin.* Bakry-Emery axioms (BGL Ch. 2)
  main_results:
    - declaration: "GaussianHilbert.hermiteMulti_orthogonality"
      file: "GaussianHilbert/HermitePolynomials.lean"
      sorry_count: 0
      axioms: []
      literature_dependencies:
        - statement: "L^2(gamma_n) orthogonality of multivariate Hermite polynomials: int H_alpha H_beta dgamma_n = delta_{alpha,beta} prod_i alpha_i!"
          source: "ISBN:978-0-521-56128-0"
    - declaration: "GaussianHilbert.hermiteMulti_dense"
      file: "GaussianHilbert/HermitePolynomials.lean"
      sorry_count: 0
      axioms: []
      literature_dependencies:
        - statement: "L^2-density of the multivariate Hermite system in L^2(gamma_n)"
          source: "ISBN:978-0-521-56128-0"
    - declaration: "GaussianHilbert.wienerChaos_isHilbertSum"
      file: "GaussianHilbert/WienerChaos.lean"
      sorry_count: 0
      axioms: []
      literature_dependencies:
        - statement: "Wiener chaos decomposition L^2(gamma_n) = orthogonal Hilbert sum of the chaos levels H_k"
          source: "ISBN:978-0-521-56128-0"
    - declaration: "GaussianHilbert.ouGenerator_hermiteMultiEval"
      file: "GaussianHilbert/OUEigenfunctions.lean"
      sorry_count: 0
      axioms: []
      literature_dependencies:
        - statement: "OU generator eigenfunction theorem: (Delta - x.grad) H_alpha = -|alpha| H_alpha"
          source: "ISBN:978-3-319-00226-2"
    - declaration: "GaussianHilbert.ouSemigroupAct_eLpNorm_hypercontractive"
      file: "GaussianHilbert/HypercontractivityFromBE.lean"
      sorry_count: 0
      axioms: []
      literature_dependencies:
        - statement: "Nelson hypercontractive bound for the OU semigroup, via Gross's LSI <-> hypercontractivity duality and Bakry-Emery"
          source: "10.1016/0022-1236(73)90025-6"
    - declaration: "GaussianHilbert.bonami_nelson_chaos"
      file: "GaussianHilbert/PolynomialChaosConcentration.lean"
      sorry_count: 0
      axioms: []
      literature_dependencies:
        - statement: "Bonami-Beckner-Nelson bound on the k-th chaos: ||f||_{L^p} <= (p-1)^{k/2} ||f||_{L^2}"
          source: "ISBN:978-3-319-00226-2"
    - declaration: "GaussianHilbert.polynomial_chaos_concentration"
      file: "GaussianHilbert/PolynomialChaosConcentration.lean"
      sorry_count: 0
      axioms: []
      literature_dependencies:
        - statement: "Janson Theorem 5.10 polynomial-chaos concentration: P(|F| > lambda ||F||_{L^2}) <= 2 exp(-c_d lambda^{2/d})"
          source: "ISBN:978-0-521-56128-0"
    - declaration: "GaussianHilbert.polynomial_dense_L2_of_subGaussian"
      file: "GaussianHilbert/PolynomialDensity.lean"
      sorry_count: 0
      axioms: []
      literature_dependencies:
        - statement: "L^2 density of polynomials for a sub-Gaussian measure on Fin n -> R (Carleman moment-determinacy route)"
          source: "ISBN:978-0-521-56128-0"

