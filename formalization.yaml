    codex auxiliary) and docs (Gemini vetting only). Codex version recorded as
    'codex' in trailers; gpt-5-codex assumed per project convention.

fidelity:
  divergences: >
    Restricted to the finite-dimensional setting (standard product Gaussian
    gamma_n on R^n) rather than a general/infinite-dimensional Gaussian Hilbert
    space; this avoids infinite-dim Malliavin calculus while preserving the
    algebraic and spectral content. Five of the six library files were relocated
    from markov-semigroups (MarkovSemigroups/Gaussian/*) and one from
    gaussian-field. The hypercontractivity bound is obtained through the abstract
    markov-semigroups Gross/Bakry-Emery framework rather than Nelson's original
    Mehler-kernel argument.

